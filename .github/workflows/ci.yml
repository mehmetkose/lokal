name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['website/**'] # the website has its own workflow, website.yml
  pull_request:
    paths-ignore: ['website/**']
  workflow_call: # release.yml runs the same checks before it builds
  workflow_dispatch: # run by hand: gh workflow run ci.yml (e.g. when a push didn't start a run)

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: fmt, clippy, test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (no setup needed; LOKAL_HOME sandboxes, high ports)
        run: cargo test --workspace

  formula:
    # The Homebrew formula, rendered from packaging/homebrew/lokal.rb.in with
    # dummy checksums, must pass the style rules that `brew audit --strict`
    # applies when a release is published (homebrew.yml). Run in a Formula/
    # folder, like a tap, so brew style uses its formula rules.
    name: Homebrew formula (brew style)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: render and check
        run: |
          dir="$RUNNER_TEMP/tap/Formula"
          mkdir -p "$dir"
          # Distinct dummies: identical ones would make both branches equal,
          # which brew style flags (Style/IdenticalConditionalBranches).
          {
            echo "$(printf '%064d' 1)  lokal-0.0.0-aarch64-apple-darwin.tar.gz"
            echo "$(printf '%064d' 2)  lokal-0.0.0-x86_64-apple-darwin.tar.gz"
          } > "$RUNNER_TEMP/SHA256SUMS"
          scripts/homebrew-formula.sh 0.0.0 "$RUNNER_TEMP/SHA256SUMS" > "$dir/lokal.rb"
          ruby -c "$dir/lokal.rb"
          brew style "$dir/lokal.rb"

  linux:
    # The test suite runs on Linux too, on x86_64 and arm64: the tests that
    # need no setup (LOKAL_HOME sandboxes, high ports). Setup itself needs
    # sudo, systemd-resolved 258+ and a user manager, which runners lack.
    name: clippy, test (Linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (no setup needed; LOKAL_HOME sandboxes, high ports)
        run: cargo test --workspace --no-fail-fast
      - name: build (links every binary, which clippy and the tests don't)
        run: cargo build --workspace
      - name: VERIFY V9, V10, V11 on Linux (by hand only; results go to SPEC §12)
        # Documents this runner's results (kernel, distribution, ss, /bin/sh)
        # without running on every push: gh workflow run ci.yml --ref <branch>
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          cargo build -p testkit --bin verify_ss_port_owners --bin verify_linux_tree --bin verify_process_groups
          failed=0
          for v in verify_ss_port_owners verify_linux_tree verify_process_groups; do
            for run in 1 2 3; do
              echo "::group::$v, run $run"
              "./target/debug/$v" || { echo "$v exited $?"; failed=1; }
              echo "::endgroup::"
            done
          done
          exit "$failed"
