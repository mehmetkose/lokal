[workspace]
resolver = "3"
members = ["crates/lokal", "crates/testkit"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Mehmet Kose"]
repository = "https://github.com/mehmetkose/lokal"
homepage = "https://github.com/mehmetkose/lokal"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser", "crypto"] }
rustls-platform-verifier = "0.7"
x509-parser = "0.18"
notify = "8"
arc-swap = "1"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ring = "0.17"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

# Dependencies without debug info keep target/ small; ring stays fast in tests.
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
debug = false
strip = true
